name: Deploy portfolio from release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy from'
        required: true
        default: 'v1'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch index.html from release
        run: |
          curl -fSL -o index.html "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/index.html"
          echo "downloaded $(wc -c < index.html) bytes"

      - name: Commit to main
        run: |
          git config user.name "shrestha-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "deploy: portfolio from release ${{ inputs.tag }}" || echo "nothing new to commit"
          git push
